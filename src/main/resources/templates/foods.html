<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>グルメ一覧</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
	
    /* 地域全体（左右2列にする） */
    .regions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2列 */
      gap: 30px;
      align-items: start;
    }

    /* 各地域ブロック */
    .region-block {
	  width: 850px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }

    .region-title {
      border-left: 6px solid #4CAF50;
      padding-left: 10px;
      font-size: 1.4em;
      margin-bottom: 20px;
      color: #333;
    }

    /* 各料理カード（縦方向） */
 	.food-card { 
		background-color: #fff;
		border-radius: 10px; 
		box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
		width: 230px; 
		padding: 15px; 
		text-align: center; 
		transition: transform 0.2s; 
	} 
	
	.food-card:hover { 
		transform: scale(1.05);
	} 
	
	.food-card img { 
		width: 100%; 
		height: 150px; 
		object-fit: cover; 
		border-radius: 5px; 
		margin-bottom: 10px; 
	} 
	
	.food-card h3 { 
		text-decoration: none; 
		color: #333; 
		font-weight: bold; 
	} 
	
	.food-card p { 
		font-size: 0.9em; 
		color: #666; 
	}
	
	.food-list {
	  display: flex;
	  flex-wrap: wrap;
	  gap: 15px;
	  justify-content: flex-start;
	}

    /* スマホでは1列 */
    @media (max-width: 900px) {
      .regions-grid {
        grid-template-columns: 1fr;
      }
    }
	
	body {
	  margin: 0;
	  padding-top: 100px;
	  padding-bottom: 100px;
	  font-family: 'Nunito', 'Noto Sans JP', sans-serif;
	  background: #6BCADB; 
	  color: #333;
	  text-align: center;
	}
	
	.google_translate_element{
	position: absolute;
	left: 20px;
	top: 20px;
	 }
	 
	 .translate-box {
	   position: absolute;
	   left: 350px;
	   top: 30px;
	 }
	 
	 .fixed-nav {
	 	position: fixed;
	 	/* 画面に対して位置を固定する */
	 	bottom: 25px;
	 	/* 画面の下端から20px上に配置 */
	 	right: 20px;
	 	/* 画面の右端から20px左に配置 */
	 	z-index: 1100;
	 	/* ページのコンテンツに埋もれないように最前面に表示 */
	 	/* ボタンを縦に並べる（初期設定のHTMLから変更がない場合） */
	 	display: flex;
	 	flex-direction: column;
	 	gap: 10px;}/* ボタン間の間隔 */
	 	.footer-spacer {height: 80px;}/*韓国がフッターに隠れたので上にあげる*/

		/* 親コンテナは画面右下に固定 */
		.button-container {
		    position: fixed;
		    bottom: 100px;
		    right: 20px;
		    width: 60px;
		    height: 60px;
		}

		.fixed-btn {
		    background: #fff;
		    color: #333;
		    width: 60px;
		    height: 60px;
		    border-radius: 50%;
		    border: 1px solid #ccc;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    font-weight: 700;
		    text-decoration: none;
		    position: fixed;
		    bottom: 100px;
		    right: 20px;
		    opacity: 0.3;            /* 常に半透明 */
		    transition: transform 0.3s ease, opacity 0.3s ease;
		    cursor: pointer;
		    z-index: 1100;
		}

		.fixed-btn:hover {
		    transform: scale(1.2);   /* 拡大して目立たせる */
		    opacity: 1;               /* 完全に表示 */
		    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
		}



	 
  </style>
  
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'ja'}, 'google_translate_element');
    }
  </script>
  <script defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script defer th:src="@{/js/script.js}"></script>
  
</head>
<body>

<h1>グルメ一覧</h1>

<header th:replace="fragments/header :: header"></header>

<!-- 地域を2列で並べる -->
<div class="regions-grid">
  <div class="region-block" th:each="entry : ${foodsByRegion}">
    <div class="region-title" th:text="${entry.key}">Region Name</div>

	<div class="food-list">
	  <a th:each="food : ${entry.value}"
	     th:href="@{/region/{id}(id=${food.region.id})}"
	     class="food-card">
	    <img th:src="@{${food.imageUrl}}" th:alt="${food.name}">
	    <h3 th:text="${food.name}"></h3>
	    <p th:text="${food.description}"></p>
	  </a>
	</div>
</div>
</div>

<!-- 固定ナビ style= で上へボタンを常に右下指定-->
<div class="button-container">
    <a href="#" class="fixed-btn">
        🔼 上へ
    </a>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
