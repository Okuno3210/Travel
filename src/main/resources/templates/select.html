<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>海外旅行先 検索</title>
    <style>
		 body {
		            font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
					background-image: url('/images/select_background.png');
					            background-size: cover;
					            background-position: center;
					            background-repeat: no-repeat;
					            background-attachment: fixed;
					            background-color: #f4f4f9;

		            margin: 0;
		            padding: 0;
		        }

		        /* === ヘッダー === */
		        header {
		            background-color: white;
		            display: flex;
		            justify-content: space-between;
		            align-items: center;
		            padding: 20px 23px;
		            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		        }

				.logo-img {
				    height: 55px; /* または top.html と同じサイズに合わせる */
				    width: auto;
				}

		        nav {
		            display: flex;
		            gap: 20px;
		        }

		        .nav-btn {
		            border: none;
		            border-radius: 30px;
		            font-size: 24px;
		            padding: 10px 25px;
		            cursor: pointer;
		            color: white;
		            font-weight: 600;
		            transition: 0.2s;
		        }

		        .btn-map { background: #FF5C8D; }
		        .btn-condition { background: #6EC1E4; }
		        .btn-tour { background: #FFD43B; color: #333; }

		        .nav-btn:hover { opacity: 0.8; }

		        .login-btn {
		            background: #FFD43B;
		            border-radius: 25px;
		            padding: 8px 20px;
		            font-weight: 600;
		            border: none;
		            cursor: pointer;
		        }
				
				.login-btn:hover {
									      transform: translateY(-2px);
									      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
									    }
				
				.center-button-container {
				    text-align: center;
				    margin-top: 20px;  
				    margin-bottom: 20px; 
				}
				
				footer {
					      background-color: #A8E6CF;
					      display: flex;
					      justify-content: center;
					      gap: 30px;
					      padding: 35px 0;
					      flex-wrap: wrap;
					    }

					    .footer-btn {
					      font-size: 18px;
					      font-weight: bold;
					      color: white;
					      padding: 15px 40px;
					      border-radius: 25px;
					      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
					      transition: transform 0.2s, box-shadow 0.2s;
					    }

					    .footer-btn:hover {
					      transform: translateY(-2px);
					      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
					    }

					    .gourmet-btn { background: #FF6B81; color: #202340;}
					    .scenic-btn { background: #80C2FF; color: #202340;}
					    .activity-btn { background: #FFC93C; color: #202340; }

		        /* === メイン === */
		        .main-container {
		            text-align: center;
		            padding: 50px 20px;
		        }

		        h1 {
		            color: #333;
		            font-size: 28px;
		            margin-bottom: 20px;
		        }

				.search-card {
				    display: block; 
				    width: fit-content; 
				  
				    background: white;
				    padding: 30px 50px;
				    border-radius: 20px;
				    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
				    margin: 0 auto 40px auto;
				}

		        .search-card select {
		            border: 2px solid #ccc;
		            border-radius: 10px;
		            padding: 10px;
		            margin: 10px;
		            width: 200px;
		            font-size: 15px;
		        }

		        .search-btn {
		            background: #FF5C8D;
		            border: none;
		            color: white;
		            padding: 12px 30px;
		            border-radius: 30px;
		            font-size: 16px;
		            margin-top: 15px;
		            cursor: pointer;
		            transition: 0.2s;
		        }

		        .search-btn:hover {
		            background: #ff79a6;
		        }

		        /* === 結果カード === */
		        .result-grid {
		            display: flex;
		            flex-wrap: wrap;
		            justify-content: center;
		            gap: 20px;
		        }

		        .result-card {
		            background: white;
		            width: 250px;
		            border-radius: 15px;
					min-height: 430px;
		            overflow: hidden;
		            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
		            text-align: left;
		            transition: transform 0.2s;
					padding:2px ;
		        }
				
				

		        .result-card:hover {
		            transform: translateY(-5px);
		        }

		        .result-card img {
		            width: 100%;
		            height: 160px;
		            object-fit: cover;
		        }

				.result-info p {
				    line-height: 1.5em; 
				    min-height: calc(1.5em * 3); /* 常に3行分の高さを確保 */
				    max-height: calc(1.5em * 3); /* 3行を超えたら省略される */
				    
				    overflow: hidden;
				    display: -webkit-box;
				    -webkit-box-orient: vertical;
				    -webkit-line-clamp: 3; /* 3行に制限 */
				    text-overflow: ellipsis;
				    white-space: normal;
				    margin-bottom: 10px;
				    padding: 15px; 
				}
				
				.result-info h3 {
				    margin: 10px;
					scroll-margin-bottom:5px;
				}

				.result-info h5 {
				    margin: 10px; 
					color: #0078FF;
				}

		        .concept-tag {
		            display: inline-block;
		            background: #EAF5FF;
		            color: #0078FF;
		            font-size: 12px;
		            padding: 4px 12px;
		            border-radius: 10px;
		            margin: 5px;
		        }
		    </style>
		</head>
		<body>
			
			<header>
			    <div class="logo-container">
					<a th:href="@{/}">
			        <img th:src="@{/images/travel_pop_logo.png}" alt="TRAVEL POP!" class="logo-img">
					</a>
			    </div>
			    <nav>
			       
			    </nav>
			    <a th:href="@{/login}" class="login-btn">Login</a>
			</header>
    

        <!-- 検索フォーム -->
		<!-- 追加予定→コンセプト、 -->
		<br><br>
        <form action="/select/filter" method="GET"class="search-card">
		
			        <h3>条件を選択</h3>
            <label for="budget">予算:</label>
            <select id="budget" name="budget">
                <option value="" th:selected="${budget == ''}">全て</option>
                <option value="low" th:selected="${budget == 'low'}">格安</option>
                <option value="medium" th:selected="${budget == 'medium'}">普通</option>
                <option value="high" th:selected="${budget == 'high'}">豪華</option>
            </select>

            <label for="time">移動時間:</label>
            <select id="time" name="time">
                <option value="" th:selected="${time == ''}">全て</option>
                <option value="short" th:selected="${time == 'short'}">10時間以内</option>
                <option value="medium" th:selected="${time == 'medium'}">10～15時間</option>
                <option value="long" th:selected="${time == 'long'}">15時間以上</option>
            </select>

            <label for="timezone">時差:</label>
            <select id="timezone" name="timezone">
                <option value="" th:selected="${timezone == ''}">全て</option>
                <option value="+0_3" th:selected="${timezone == '+0_3'}">+0～3時間</option>
                <option value="+3_6" th:selected="${timezone == '+3_6'}">+3～6時間</option>
                <option value="+6_9" th:selected="${timezone == '+6_9'}">+6～9時間</option>
                <option value="+9_12" th:selected="${timezone == '+9_12'}">+9～12時間</option>
                <option value="+12_plus" th:selected="${timezone == '+12_plus'}">+12時間～</option>
                <option value="-0_3" th:selected="${timezone == '-0_3'}">-0～3時間</option>
                <option value="-3_6" th:selected="${timezone == '-3_6'}">-3～6時間</option>
                <option value="-6_9" th:selected="${timezone == '-6_9'}">-6～9時間</option>
                <option value="-9_12" th:selected="${timezone == '-9_12'}">-9～12時間</option>
                <option value="-12_minus" th:selected="${timezone == '-12_minus'}">-12時間～</option>
            </select>
			
			<label for="concept">コンセプト:</label>
			<select id="concept" name="concept">
			    <option value="" th:selected="${concept == ''}">全て</option>
			    <option value="美術" th:selected="${concept == '美術'}">美術</option>
			    <option value="グルメ" th:selected="${concept == 'グルメ'}">グルメ</option>
			    <option value="絶景" th:selected="${concept == '絶景'}">絶景</option>
				<option value="歴史・文化" th:selected="${concept == '歴史・文化'}">歴史・文化</option>
				<option value="体験" th:selected="${concept == '体験'}">体験</option>
			    <option value="ショッピング" th:selected="${concept == 'ショッピング'}">ショッピング</option>
			</select>

            <br>
            <button type="submit" style="margin-top: 20px; padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                検索
            </button>
        </form>
    </div>

    <!-- 検索結果 -->
	

	<div class="result-grid">
	    <a th:each="r : ${results}"
	       th:if="${r != null}" th:href="@{'/region/' + ${r.id}}"
	       class="result-card-link"
	       style="text-decoration: none; color: inherit;">
	        <div class="result-card">
	            <img th:src="${r.imageUrl}" alt="地域画像">
	            <div class="result-info">
	                <h3 th:text="${r.name}"></h3><h5 th:text="${r.country.name}"></h5>
	                <p th:text="${r.description}"></p>
	                <div>
	                    <span th:each="c : ${r.concepts}" th:text="${c.name}" class="concept-tag"></span>
	                </div>
	            </div>
	        </div>
	    </a>
	</div>
	
	<br>

	<div class="center-button-container"> <button type="button" class="fotter-btn login-btn" onclick="history.back()">← ひとつ前に戻る</button>
	</div>
	<footer>
	  <a th:href="@{/gourmet}" class="footer-btn gourmet-btn">🍴 グルメ旅</a>
	  <a th:href="@{/scenic}" class="footer-btn scenic-btn">🏞 絶景スポット</a>
	  <a th:href="@{/activity}" class="footer-btn activity-btn">🎡 アクティビティ体験</a>
	
	</footer>
</body>
</html>
