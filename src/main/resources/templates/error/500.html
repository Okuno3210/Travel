<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TravelPop - エラーが発生しました</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-container">
    <img src="/images/travel_pop_logo.png" alt="TravelPop" class="logo">

    <h1>500 - Internal Server Error</h1>

    <a th:href="@{/}" class="btn">トップへ戻る</a>
</div>
</body>
</html>
