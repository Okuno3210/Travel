<!DOCTYPE html> 
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAVEL POP!</title>
<link rel="stylesheet" th:href="@{/css/top.css}">

<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({pageLanguage: 'ja'}, 'google_translate_element');
  }
</script>

<script defer type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script defer type="text/javascript" src="/js/script.js"></script>

</head>

<body>
	

  <!-- 上部白帯 -->
  <header>
    <div class="logo-container">
      <img th:src="@{/images/travel_pop_logo.png}" alt="TRAVEL POP!" class="logo-img">
    </div>
	
	<div id="google_translate_element" class="translate-box"></div>
	
	<div class="center-buttons">
	    <a th:href="@{/maplink}" class="btn center-btn map-btn">地図検索</a>
	    <a th:href="@{/select}" class="btn center-btn select-btn">条件検索</a>
	    <a th:href="@{/plantrip}" class="btn center-btn plan-btn">ツアープラン一覧</a>
	 </div>
	 
    <!-- 未ログイン時のみ表示 -->
    <div th:if="${!#authorization.expression('isAuthenticated()')}">
      <a href="/login" class="btn login-btn">Login</a>
    </div>

    <!-- ログイン済み時のみ表示 -->
    <div th:if="${#authorization.expression('isAuthenticated()')}">
      <a href="/list" class="btn mypage-btn">Mypage</a>
    </div>
  </header>

  <!-- メインエリア -->
  <main>
	
<!--	<div id="google_translate_element"></div>-->
	
	<div class="banner-container">
		  <div class="banner-slide">
			 <a th:href="@{/country/1/regions}">
			   <img th:src="@{/images/country/America.png}" alt="アメリカ">
			 </a>
		     <a th:href="@{/country/2/regions}">
			   <img th:src="@{/images/country/Italy.png}" alt="イタリア">
			 </a>
			 <a th:href="@{/country/3/regions}">
			   <img th:src="@{/images/country/France.png}" alt="フランス">
			 </a>
			 <a th:href="@{/country/4/regions}">
			   <img th:src="@{/images/country/Vietnam.png}" alt="ベトナム">
			 </a>
			 <a th:href="@{/country/5/regions}">
			   <img th:src="@{/images/country/Switzerland.png}" alt="スイス">
			 </a>
			 <a th:href="@{/country/6/regions}">
			   <img th:src="@{/images/country/Australia.png}" alt="オーストラリア">
			 </a>
		     <a th:href="@{/country/7/regions}">
			   <img th:src="@{/images/country/Thailand.png}" alt="タイ">
			 </a>
			 <a th:href="@{/country/8/regions}">
			   <img th:src="@{/images/country/Egypt.jpg}" alt="エジプト">
			 </a>
			 <a th:href="@{/country/9/regions}">
			   <img th:src="@{/images/country/Iran.png}" alt="イラン">
			 </a>
			 <a th:href="@{/country/10/regions}">
			   <img th:src="@{/images/country/India.png}" alt="インド">
			 </a>
			 <a th:href="@{/country/11/regions}">
			   <img th:src="@{/images/country/China.jpg}" alt="中国">
			 </a>
			 <a th:href="@{/country/12/regions}">
			   <img th:src="@{/images/country/Russia.png}" alt="ロシア">
			 </a>
			 <a th:href="@{/country/13/regions}">
			   <img th:src="@{/images/country/Korea.png}" alt="韓国">
			 </a>
			 <a th:href="@{/country/1/regions}">
			   <img th:src="@{/images/country/America.png}" alt="アメリカ">
			 </a>
			 <a th:href="@{/country/2/regions}">
			   <img th:src="@{/images/country/Italy.png}" alt="イタリア">
			 </a>
			 <a th:href="@{/country/3/regions}">
			   <img th:src="@{/images/country/France.png}" alt="フランス">
			 </a>
			 <a th:href="@{/country/4/regions}">
			   <img th:src="@{/images/country/Vietnam.png}" alt="ベトナム">
			 </a>
			 <a th:href="@{/country/5/regions}">
			   <img th:src="@{/images/country/Switzerland.png}" alt="スイス">
			 </a>
		 </div>
		</div>
	<!-- 🌍 地図背景に合わせて飛ぶアニメーション -->
	<div class="map-flight-area">
		<!-- 🌍 地図上を自然に飛ぶ飛行機アニメーション -->
		<!-- 🌍 地図の上を右から左へ飛ぶ -->
		<svg class="map-flight" width="100%" height="400" viewBox="0 0 800 400">
		  <!-- ✈️ 飛行ルート：右(日本側) → 左(アメリカ側) -->
		  <path id="mapFlightPath"
		        d="M760,200
		           Q620,180 420,220
		           Q240,260 40,230"
		        fill="none"
		        stroke="transparent" />

		  <!-- ✈️ 飛行機画像（右向きのままでOK） -->
		  <image href="/images/airplane.png" width="80">
		    <!-- auto-reverseでパス進行方向に機首を向ける -->
		    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto-reverse" keyTimes="0;0.5;1" keySplines="0.5 0 0.5 1" calcMode="linear">	
		      <mpath href="#mapFlightPath"/>
		    </animateMotion>
		  </image>
		</svg>
	</div>


    <img th:src="@{/images/landmarks_illustration.png}" alt="世界のランドマーク" class="landmarks-img">
	<!-- 飛行機アニメーション用エリア -->
	<div class="sky">
	  <img src="/images/airplane.png" alt="飛行機" class="airplane">
	</div>

	
    <div class="catch-copy">
      <h1>世界のワクワク、覗いてみよう！</h1>
      <p>さあ、次の冒険へ出発！</p>
    </div>
	
	<div class="random-tourist-spot">
	    <h2>おすすめ観光スポット</h2>
	    
		<div class="random-images">
			<div th:each="spot : ${randomSpots}">
			    <a th:href="@{'/region/' + ${spot.region.id}}">
			        <img th:src="@{${spot.imageUrl}}" alt="tourist spot" class="tourist-img">
			    </a>
			</div>
		</div>

	</div>

  </main>

  <!-- 下部緑帯 -->
  <footer>
    <a th:href="@{/gourmet}" class="btn footer-btn gourmet-btn">グルメ旅</a>
    <a th:href="@{/scenic}" class="btn footer-btn scenic-btn">絶景スポット</a>
    <a th:href="@{/activity}" class="btn footer-btn activity-btn">アクティビティ体験</a>
	<a th:href="@{/foods}" class="btn footer-btn foods-btn">グルメ一覧</a>
  </footer>

</body>
</html>
