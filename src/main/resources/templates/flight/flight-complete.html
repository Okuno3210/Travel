<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>航空券予約完了 | TravelMap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  
  <style>
	
	.google_translate_element{
	position: absolute;
	left: 20px;
	top: 20px;
	 }
	 
	 .translate-box {
	   position: absolute;
	   left: 350px;
	   top: 30px;
	 }
	 
	main{
		padding-top: 100px;
	}
  </style>
  
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'ja'}, 'google_translate_element');
    }
  </script>
  <script defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script defer th:src="@{/js/script.js}"></script>
  
</head>
<body>
	
	<header th:replace="fragments/header :: header"></header>

  <main class="complete-page">
    <h1>🎉 ご予約が完了しました！</h1>
    <!-- ✅ 予約情報のまとめ -->
    <section class="summary">
      <h2>✈️ ご予約内容</h2>
      <p th:text="'予約番号: ' + ${bookingNumber}"></p>
      <p th:text="'出発地: ' + ${departure.name} + '（' + ${departure.code} + '）'"></p>
      <p th:text="'目的地: ' + ${destination.name} + '（' + ${destination.code} + '）'"></p>
      <p th:text="'出発日: ' + ${date}"></p>
      <p th:text="'人数: ' + ${passenger} + '名'"></p>
      <p th:text="'合計金額: 約' + ${price} + '円'"></p>
    </section>

    <!-- ✅ 今後の流れ -->
    <section class="next-actions">
      <h3>今後の流れ</h3>
      <ul>
        <li>✉️ ご登録のメールアドレスに予約確認メールを送信しました。</li>
        <li>📱 出発の24時間前にオンラインチェックインを行ってください。</li>
        <li>💺 マイページからチケット情報を確認できます。</li>
      </ul>
    </section>

    <!-- ✅ ボタン操作 -->
    <div class="buttons">
      <a href="/mypage" class="btn">マイページへ</a>
      <a href="/" class="btn back-btn">🏠 トップへ戻る</a>
    </div>
  </main>

  <footer>
    <p>© 2025 TravelMap</p>
  </footer>
</body>
</html>
