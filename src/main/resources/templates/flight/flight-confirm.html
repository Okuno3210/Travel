<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>航空券予約確認 | TravelMap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  
  <style>
	
	.google_translate_element{
	position: absolute;
	left: 20px;
	top: 20px;
	 }
	 
	 .translate-box {
	   position: absolute;
	   left: 350px;
	   top: 30px;
	 }
	 
  main{
  	padding-top: 100px;
  }
  </style>
  
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'ja'}, 'google_translate_element');
    }
  </script>
  <script defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script defer th:src="@{/js/script.js}"></script>
  
</head>
<body>
	
	<header th:replace="fragments/header :: header"></header>
    <h1>✈️ 航空券予約確認</h1>

  <main class="confirm-page">
    <h2>以下の内容で予約しますか？</h2>

    <div class="confirm-card">
      <p th:text="'出発地: ' + ${departure.name} + '（' + ${departure.code} + '）'"></p>
      <p th:text="'目的地: ' + ${destination.name} + '（' + ${destination.code} + '）'"></p>
      <p th:text="'出発日: ' + ${date}"></p>
      <p th:text="'人数: ' + ${passenger} + '名'"></p>
      <p th:text="'料金: 約' + ${price} + '円'"></p>
    </div>

    <!-- ✅ 完了ページへ送信 -->
    <form th:action="@{/flight/complete}" method="post" class="confirm-form">
      <input type="hidden" name="departureCode" th:value="${departure.code}">
      <input type="hidden" name="destinationCode" th:value="${destination.code}">
      <input type="hidden" name="date" th:value="${date}">
      <input type="hidden" name="passenger" th:value="${passenger}">
      <input type="hidden" name="price" th:value="${price}">

      <button type="submit" class="btn">✅ この内容で予約する</button>
      <a href="/flight/result" class="btn back-btn">戻る</a>
    </form>
  </main>

  <footer>
    <p>© 2025 TravelMap</p>
  </footer>
</body>
</html>
