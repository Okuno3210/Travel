<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${country.name} + ' 観光地ガイド | TravelMap'">TravelMap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  
  <style>
	.google_translate_element{
	position: absolute;
	left: 20px;
	top: 20px;
	 }
	 
	 .translate-box {
	   position: absolute;
	   left: 350px;
	   top: 30px;
	 }
  </style>
  
  <!-- Google翻訳ウィジェット -->
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'ja'}, 'google_translate_element');
    }
  </script>
  <script defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script defer th:src="@{/js/script.js}"></script>
</head>

<body>
  <!-- 共通ヘッダー -->
  <header th:replace="fragments/header :: header"></header>

  <h1 th:text="${country.name} + ' の人気観光地'">国名の人気観光地</h1>

  <!-- 国の概要 -->
  <section class="country-summary">
    <img th:src="${country.imageUrl}" alt="国の画像" class="country-image">
    <p th:text="${country.description}">国の説明</p>
  </section>

  <main>
    <!-- 為替レート表示 -->
    <div id="rates" class="fx-rate"></div>

    <!-- 地域一覧 -->
    <section th:if="${regions != null and !#lists.isEmpty(regions)}">
      <h2>🌍 地域一覧</h2>
      <div class="region-grid">
        <div class="region-card" th:each="region : ${regions}">
          <img th:src="${region.imageUrl}" alt="" class="region-image">
          <div class="region-text">
            <h3 th:text="${region.name}">地域名</h3>
            <p th:text="${region.description}">説明</p>
            <ul class="region-info">
              <li>💰 予算：<span th:text="${region.budget}">--万円</span></li>
              <li>✈️ フライト時間：<span th:text="${region.flightTime}">--時間</span></li>
              <li>☀️ 気候：<span th:text="${region.climate}">--</span></li>
            </ul>
            <a th:href="@{/region/{id}(id=${region.id})}" class="btn">詳細を見る</a>
          </div>
        </div>
      </div>
    </section>
	
	<a th:href="@{/flight/search(country=${country.name})}" class="btn">✈️ 航空券を探す</a>


    <!-- 地域がない場合 -->
    <section th:if="${regions == null or #lists.isEmpty(regions)}">
      <p>この国には登録された地域がありません。</p>
    </section>

    <!-- お気に入り登録 -->
    <form th:action="@{/favorites/add/{countryId}(countryId=${country.id})}" method="post"
          sec:authorize="hasRole('USER')">
      <button type="submit" class="btn">★ お気に入り登録</button>
    </form>

    <!-- 戻るボタン -->
    <div class="bottom-buttons">
      <button type="button" class="btn back-btn" onclick="history.back()">← ひとつ前に戻る</button>
    </div>

    <!-- デバッグ用 -->
    <div class="debug-info" th:if="${country != null}">
      <p>ID: <span th:text="${country.id}"></span></p>
    </div>
    <div class="debug-info" th:if="${country == null}">
      <p>国データが見つかりません。</p>
    </div>
  </main>

  <!-- 共通フッター -->
  <div th:replace="fragments/footer :: footer"></div>

  <!-- 為替レートJS -->
  <script th:src="@{/js/rates.js}"></script>

  <!-- ページ読み込み後に開始 -->
  <script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
      const countryCode = /*[[${country.code}]]*/ 'USA';
      FxRate.start("rates", countryCode, 5000); // 5秒ごとに更新
    });
  </script>
</body>
</html>
